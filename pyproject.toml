[project]
name = "maildb"
version = "0.1.0"
description = "Local-first multi-provider email database with a safe SQL interface"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sean Davis", email = "seandavi@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25.0",
    "yoyo-migrations>=8.2",
    "python-ulid>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "html2text>=2024.2.26",
    "tenacity>=8.3",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "keyring>=25.2",
]
server = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]

[project.scripts]
maildb = "maildb.cli:app"
maildb-mcp = "maildb.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maildb"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/maildb"]

[[tool.mypy.overrides]]
module = [
    "yoyo.*",
    "html2text.*",
    "google.*",
    "google.cloud.*",
    "google.oauth2.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "keyring.*",
]
ignore_missing_imports = true

# The Google client libraries are largely untyped. Calling into them from
# strict code is unavoidable, and the wrapper is thin by design (ADR
# 0011); the exemption is scoped to the one module that touches them.
[[tool.mypy.overrides]]
module = ["maildb.providers.gmail"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
